spring:
  application:
    name: coral_shop_backend
  
  # Configuración de la base de datos PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/coral_shop_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  # Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
